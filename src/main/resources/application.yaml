spring:
  application:
    name: booking-service
  # Local development: secrets can live in a git-ignored .env file (see .env.example).
  config:
    import: optional:file:.env[.properties]
  # Local defaults match docker-compose.yml; override via env vars
  # (SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD).
  datasource:
    url: jdbc:postgresql://localhost:5432/booking
    username: booking
    password: booking
  threads:
    virtual:
      enabled: true
  jackson:
    property-naming-strategy: SNAKE_CASE
    deserialization:
      # Money is integer paise: reject 250.5 instead of silently truncating it to 250.
      accept-float-as-int: false

app:
  auth:
    # Required, no defaults: startup fails if these are missing.
    jwt-secret: ${JWT_SECRET:}
    admin-secret: ${ADMIN_SECRET:}
    token-ttl: 2h

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
