spring:
  application:
    name: booking-service
  # Local defaults match docker-compose.yml; override via env vars
  # (SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD).
  datasource:
    url: jdbc:postgresql://localhost:5432/booking
    username: booking
    password: booking
  threads:
    virtual:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
