spring:
  application:
    name: booking-service
  # Local development: secrets can live in a git-ignored .env file (see .env.example).
  config:
    import: optional:file:.env[.properties]
  # Local defaults match docker-compose.yml; override via env vars
  # (SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD).
  datasource:
    url: jdbc:postgresql://localhost:5432/booking
    username: booking
    password: booking
    hikari:
      # Bound every query and lock wait so a stuck statement can't hold a pooled connection
      # indefinitely. Exceeding either returns 503 service-unavailable.
      connection-init-sql: SET statement_timeout = '10s'; SET lock_timeout = '5s'
  threads:
    virtual:
      enabled: true
  jackson:
    property-naming-strategy: SNAKE_CASE
    deserialization:
      # Money is integer paise: reject 250.5 instead of silently truncating it to 250.
      accept-float-as-int: false

app:
  auth:
    # Required, no defaults: startup fails if these are missing.
    jwt-secret: ${JWT_SECRET:}
    admin-secret: ${ADMIN_SECRET:}
    token-ttl: 2h
  reservation:
    # How long a hold lasts before it must be confirmed.
    hold-ttl: ${HOLD_TTL:2m}

logging:
  structured:
    format:
      console: logstash

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
